name: Verify and publish images

on:
  push:
    branches: [main]

permissions:
  contents: read

# Serialize publication; the push step also checks the current main SHA.
concurrency:
  group: ci-images-main
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Local CI values only. No production services or credentials.
      DATABASE_URL: postgresql://audit:audit@localhost:5432/audit?schema=public
      REDIS_URL: redis://localhost:6379
      NEXT_PUBLIC_APP_URL: https://seo.yasinkocak.com.tr
      EXPORT_SIGNING_SECRET: ci-only-not-a-production-secret
      COMPOSE_PROJECT_NAME: seo-ci
      COMPOSE_FILE: tests/compose.audit.yml
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Prisma client and workspace declarations
        run: |
          npm run db:generate
          npm run build:packages
          npm exec --workspace @seo/web -- next typegen
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Run the complete Vitest suite
        run: npm test
      - name: Validate production Compose without contacting services
        env:
          COMPOSE_FILE: docker-compose.yml:docker-compose.override.yml
          POSTGRES_PASSWORD: ci-only-placeholder
          IMAGE_TAG: ${{ github.sha }}
        run: docker compose config --quiet
      - name: Prepare isolated regression tests
        run: |
          npm run build -w @seo/worker
          docker build --target worker --tag seoanalyzer-worker .
          docker compose config --quiet
          docker compose up -d --wait postgres redis fixture
          docker compose run --rm --no-deps verify npm run db:migrate
      - name: Crawl integration regression
        run: docker compose run --rm --no-deps verify node /fixtures/integration-crawl.mjs
      - name: Failed job recovery regression
        run: docker compose run --rm --no-deps verify node /fixtures/recovery-check.mjs
      - name: Redis failure regression
        run: >-
          docker compose run --rm --no-deps
          -e REDIS_URL=redis://127.0.0.1:1
          verify node --import tsx /fixtures/redis-failure-check.mjs
      - name: Show isolated service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove isolated test services
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Choose lowercase GHCR image prefix
        id: images
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "prefix=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR with the job token
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build both images before publishing either one.
      - name: Build web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: web
          platforms: linux/amd64
          load: true
          tags: ${{ steps.images.outputs.prefix }}-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build worker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: worker
          platforms: linux/amd64
          load: true
          tags: ${{ steps.images.outputs.prefix }}-worker:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
      - name: Push commit, main and latest tags
        env:
          IMAGE_PREFIX: ${{ steps.images.outputs.prefix }}
          COMMIT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          for service in web worker; do
            image="${IMAGE_PREFIX}-${service}"
            docker push "${image}:${COMMIT_SHA}"
            if [ "$current_main" = "$COMMIT_SHA" ]; then
              docker tag "${image}:${COMMIT_SHA}" "${image}:main"
              docker tag "${image}:${COMMIT_SHA}" "${image}:latest"
              docker push "${image}:main"
              docker push "${image}:latest"
            fi
          done
